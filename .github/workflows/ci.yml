name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip` here -- `make install` runs pip with --no-cache-dir (kept
      # deliberately, see Makefile), so pip's cache dir is never populated and
      # setup-python's post-job step failed trying to save an empty/missing cache
      # the first time this workflow ran. Nothing to cache given how install works.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same target `make install` uses locally -- one source of truth for what
      # "installed" means, so CI can't silently drift from a developer's own setup.
      - run: make install

      - run: make lint

      - run: make test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # `next build` type-checks as part of building, so this covers both. Since
      # frontend/next.config.ts sets output: "export", this build statically
      # pre-renders every player/team page -- which means it needs a real, reachable
      # backend at build time (generateStaticParams fetches the full player/team
      # list), not just the localhost fallback in lib/api.ts. Points at the real
      # deployed API, same as every manual build this project has done so far.
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

  build-push-image:
    name: Build + push backend image
    needs: backend
    # Only on an actual merge to master, not every PR -- a PR from an untrusted fork
    # wouldn't have this federated credential's trust relationship anyway (it's
    # scoped to the master branch specifically), and pushing an image per PR would
    # just churn the registry with untested builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the short-lived OIDC token azure/login exchanges
      contents: read
    steps:
      - uses: actions/checkout@v4

      # OIDC federated credential (infra/container_registry.tf's
      # github_actions_sp_object_id + infra/README.md's bootstrap steps) -- no
      # AZURE_CLIENT_SECRET anywhere. GitHub mints a short-lived OIDC token scoped to
      # this exact repo+branch, Azure AD trusts it via the federated credential and
      # exchanges it for an access token, and that token expires with the job. No
      # long-lived secret to rotate or leak, unlike a classic service-principal
      # client secret.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Builds in Azure itself (ACR Tasks) -- same `az acr build` every manual deploy
      # this project has done so far, so the runner needs no Docker install either.
      # Tagged with the commit SHA, not `latest` -- an immutable, traceable tag so a
      # human can tell exactly which commit produced a given image. This job only
      # builds and pushes; deploying a specific tag to the Container App (via
      # TF_VAR_api_image + `terraform apply`) is still a deliberate manual step.
      #
      # --resource-group is required here, not optional: without it, `az acr build`
      # resolves --registry by NAME via a subscription-wide lookup, which needs
      # broader list/read permissions than this identity has -- it's only granted
      # AcrPush scoped to this one registry resource (least privilege, see
      # container_registry.tf), not any subscription- or resource-group-level Reader
      # role. Passing --resource-group builds the resource ID directly, skipping that
      # lookup entirely, so the narrow scope is enough. First real run failed with
      # "could not be found in subscription" despite the registry existing -- this is
      # why.
      - run: az acr build --registry acrfifa26dev6q3jm1 --resource-group rg-fifa26-dev --image fifa26-api:${{ github.sha }} --file backend/Dockerfile backend

  terraform-apply:
    name: Deploy backend image
    needs: build-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Gates this job behind a required manual approval (GitHub Environment
    # "production", configured with a required reviewer) -- CI builds and pushes the
    # image automatically above, but nothing touches the live Container App until a
    # human clicks approve. See docs/ARCHITECTURE.md for why this project chose a
    # gated-CD design over full auto-deploy.
    environment: production
    permissions:
      id-token: write # required to request the short-lived OIDC token both terraform init (state backend) and terraform apply (azurerm provider) exchange
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Same federated credential as build-push-image's azure/login step, but
      # Terraform's own state-backend auth (versions.tf's use_azuread_auth) and its
      # azurerm provider are a separate auth path -- they don't inherit an az-cli
      # session from a prior step, so ARM_* env vars are needed here specifically.
      - name: terraform init
        working-directory: infra
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      # Deliberately -target'd to just the API container app, not a full apply --
      # see azurerm_role_assignment.github_actions_container_app_contributor's
      # comment in infra/container_apps.tf for why. In short: terraform.tfvars (with
      # this laptop's real dev IP) is gitignored and never reaches CI, so an
      # untargeted apply here would resolve TF_VAR_dev_ip_address to its empty
      # default and delete the Postgres firewall rule that lets local dev reach the
      # database. Scoping to this one resource keeps CI's blast radius to exactly
      # "deploy the image just built," nothing else in the stack.
      - name: terraform apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=azurerm_container_app.api \
            -var="api_image=acrfifa26dev6q3jm1.azurecr.io/fifa26-api:${{ github.sha }}" \
            -var="alert_email=navdeep98.sharma@gmail.com"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          TF_VAR_postgres_admin_password: ${{ secrets.TF_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_groq_api_key: ${{ secrets.TF_GROQ_API_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_sentry_dsn_backend: ${{ vars.TF_VAR_SENTRY_DSN_BACKEND }}
