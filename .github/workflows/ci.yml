name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            etl/requirements.txt
            backend/requirements-dev.txt
            backend/ml/requirements.txt
            backend/genai/requirements.txt

      # Same target `make install` uses locally -- one source of truth for what
      # "installed" means, so CI can't silently drift from a developer's own setup.
      - run: make install

      - run: make lint

      - run: make test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # `next build` type-checks as part of building, so this covers both.
      - run: npm run build
        working-directory: frontend
