name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip` here -- `make install` runs pip with --no-cache-dir (kept
      # deliberately, see Makefile), so pip's cache dir is never populated and
      # setup-python's post-job step failed trying to save an empty/missing cache
      # the first time this workflow ran. Nothing to cache given how install works.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same target `make install` uses locally -- one source of truth for what
      # "installed" means, so CI can't silently drift from a developer's own setup.
      - run: make install

      - run: make lint

      - run: make test

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # `next build` type-checks as part of building, so this covers both.
      - run: npm run build
        working-directory: frontend
