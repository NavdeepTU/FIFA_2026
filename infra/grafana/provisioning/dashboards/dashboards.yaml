# Tells Grafana to load any dashboard JSON files it finds in this same folder at
# startup -- the dashboard-provisioning counterpart to datasources/azure-monitor.yaml.
apiVersion: 1

providers:
  - name: fifa26
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
